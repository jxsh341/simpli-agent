[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simpli-agent"
version = "0.1.0"
description = "Embedded Python agent runtime with tool schemas and SQLite memory."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "simpli-agent contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/simpli_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
