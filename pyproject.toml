[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simpli-agent"
version = "0.1.0"
description = "Embedded Python agent runtime with tool schemas and SQLite memory."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "simpli-agent contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
openai = ["openai>=1.0"]
pydantic = ["pydantic>=2.0"]
anthropic = ["anthropic>=0.25"]
ollama = ["httpx>=0.25"]
cli = ["typer>=0.9", "rich>=13.0", "tomli>=2.0; python_version<'3.11'"]
server = ["fastapi>=0.100", "uvicorn>=0.23"]
all = ["openai>=1.0", "pydantic>=2.0", "anthropic>=0.25", "httpx>=0.25", "typer>=0.9", "rich>=13.0", "fastapi>=0.100", "uvicorn>=0.23", "tomli>=2.0; python_version<'3.11'"]

[project.scripts]
simpli-agent = "simpli_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simpli_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
